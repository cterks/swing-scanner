name: Weekly universe refresh

on:
  schedule:
    # 07:20 UTC Sunday. Rebuilds the tradable universe from the full
    # symbol directory. Runs when Yahoo is quiet and nothing else needs it.
    - cron: "20 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild the universe
        run: python universe.py

      - name: Commit the new universe
        run: |
          git config user.name "swing-scanner"
          git config user.email "actions@github.com"
          git add universe.txt
          if git diff --staged --quiet; then
            echo "Universe unchanged."
          else
            git commit -m "Universe refresh $(date -u +%Y-%m-%d)"
            git push
          fi
